<!doctype html>
<html lang="en">
  <head>
    
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <!--
      One tag, no `media`, because the app owns this: with five themes the OS
      preference is only the answer for "System". A browser uses the first
      theme-color whose media matches, so media-scoped tags here would always
      win and the chosen theme would never reach the status bar. `useTheme`
      rewrites the content on every theme change.
    -->
    <meta name="theme-color" content="#14A06A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Healthify" />
    <meta
      name="description"
      content="Track calories with a photo, barcode or your voice. Log meals, water, sleep, weight and workouts, with an AI nutrition and fitness coach."
    />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
    <title>Healthify — AI Health Tracker</title>
    <!--
      Cold-start splash. Between the HTML arriving and React mounting there is
      nothing on screen, which on a slow connection or a freshly rebuilt cache
      is a long white flash. This is inline and unconditional so it needs no
      stylesheet and no JS to appear; React replaces #root on mount, so it also
      needs nothing to remove it.

      Colours are duplicated from the Light and Dark palettes in
      styles/index.css rather than read from the vars, which have not loaded
      yet. Keep them in step if those palettes change.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: #f7f7f5;
        color: #101413;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
        text-align: center;
      }
      #boot-fail {
        max-width: 20rem;
        font-size: 0.875rem;
        line-height: 1.5;
      }
      #boot-retry {
        margin-top: 0.75rem;
        padding: 0.6rem 1.25rem;
        border: 0;
        border-radius: 0.75rem;
        background: #14a06a;
        color: #fff;
        font: inherit;
        font-weight: 600;
      }
      #boot-err {
        margin-top: 0.75rem;
        font-size: 0.6875rem;
        opacity: 0.6;
        word-break: break-word;
      }
      #boot i {
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 999px;
        border: 3px solid #cdefe0;
        border-top-color: #14a06a;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        #boot {
          background: #0b1210;
          color: #eef2f0;
        }
        #boot i {
          border-color: #1d2724;
          border-top-color: #33b985;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="Loading Healthify">
        <i></i>
        <div id="boot-fail" hidden>
          <p id="boot-msg">The app didn&rsquo;t finish loading.</p>
          <button type="button" id="boot-retry">Try again</button>
          <p id="boot-err"></p>
        </div>
      </div>
    </div>
    <!--
      Boot watchdog.

      A spinner that can hang forever is worse than the white screen it
      replaced: it looks like progress, so nobody reloads and nothing says what
      broke. If the module script fails to load or throws, React never mounts
      and #boot is never replaced — so time it out and say so, with a way out.

      Deliberately classic (not module) and dependency-free, because the whole
      point is that it survives the module bundle failing.

      A plain reload is not always enough to get out of here. A service worker
      old enough to predate a working build — installed back when this project
      may have been serving raw, unbuilt source — answers every navigation
      itself and never re-checks its own script if nothing about the update
      flow it runs ever succeeded. That worker is what a plain reload would
      hit again. So "Try again" unregisters every worker and clears every
      cache first: IndexedDB (meals, photos, tracker entries) is a completely
      separate store and is never touched by either call, so this is safe even
      as a last resort, and it is only ever reached after a real, timed-out
      boot failure and an explicit tap.
    -->
    <script>
      (function () {
        var BOOT_TIMEOUT_MS = 12000;
        var lastError = '';

        window.addEventListener('error', function (e) {
          // Resource errors have no `message`; name the file that failed.
          lastError =
            (e && e.message) ||
            (e && e.target && (e.target.src || e.target.href)) ||
            '';
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          lastError = (e && e.reason && (e.reason.message || String(e.reason))) || lastError;
        });

        function reload() {
          // Past the HTTP cache too — a half-fetched asset is the other
          // likely cause of landing here.
          var u = new URL(window.location.href);
          u.searchParams.set('__retry', Date.now().toString(36));
          window.location.replace(u.toString());
        }

        document.getElementById('boot-retry').addEventListener('click', function () {
          var btn = document.getElementById('boot-retry');
          btn.disabled = true;
          btn.textContent = 'Clearing…';

          var done = [];
          if ('serviceWorker' in navigator) {
            done.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (r) {
                    return r.unregister();
                  }),
                );
              }).catch(function () {}),
            );
          }
          if ('caches' in window) {
            done.push(
              caches.keys().then(function (keys) {
                return Promise.all(
                  keys.map(function (k) {
                    return caches.delete(k);
                  }),
                );
              }).catch(function () {}),
            );
          }

          // Reload regardless of how the clear went — a partial clear still
          // beats reloading straight back into the same stuck worker.
          var to = setTimeout(reload, 4000);
          Promise.all(done).then(function () {
            clearTimeout(to);
            reload();
          });
        });

        setTimeout(function () {
          // React replaces #root on mount, so still finding this means it never did.
          var boot = document.getElementById('boot');
          if (!boot) return;
          boot.querySelector('i').style.display = 'none';
          document.getElementById('boot-fail').hidden = false;
          if (lastError) {
            document.getElementById('boot-err').textContent = String(lastError).slice(0, 200);
          }
        }, BOOT_TIMEOUT_MS);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
