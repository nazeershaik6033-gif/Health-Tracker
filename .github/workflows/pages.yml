name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these to publish; the token is otherwise read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it, so a deploy is never half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # A project site is served from /<repo>/, so assets must be built with
        # that prefix — the default '/' base is what leaves the page blank.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npx vite build

      - name: Verify the build is actually deployable
        run: |
          test -f dist/index.html || { echo "no index.html"; exit 1; }
          # 404.html is the SPA fallback for deep links; Pages has no rewrite rule.
          test -f dist/404.html || { echo "no 404.html SPA fallback"; exit 1; }
          # Catch a base-path regression before it ships as a blank page.
          grep -q 'src="/${{ github.event.repository.name }}/assets/' dist/index.html \
            || { echo "index.html is not referencing base-prefixed assets"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
